name: Build APK

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Prepare generated assets and Gradle project
        run: |
          python3 scripts/generate-audio.py
          python3 scripts/generate-icons.py
          python3 scripts/vendor-ui-sdk.py
          python3 scripts/prepare-gradle.py

      - name: Patch manifest for Android 12+
        run: |
          sed -i 's/android:minSdkVersion="12"/android:minSdkVersion="23"/' AndroidManifest.xml
          sed -i 's/android:targetSdkVersion="27"/android:targetSdkVersion="34"/' AndroidManifest.xml
          cat AndroidManifest.xml

      - run: gradle :shell:assembleDebug

      - name: Rename APK
        run: mv shell/build/outputs/apk/debug/shell-debug.apk shell/build/outputs/apk/debug/Orbit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit
          path: shell/build/outputs/apk/debug/Orbit.apk
