name: Test music UI

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/test-ui.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Check browser behavior
        env:
          ORBIT_TEST_TOOLS: ${{ runner.temp }}/orbit-test-tools
        run: bash scripts/cloud-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orbit-browser-checks
          path: artifacts/
          if-no-files-found: ignore
